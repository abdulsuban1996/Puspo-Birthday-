<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শুভ জন্মদিন পুষ্প 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind+Siliguri:wght@400;600&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0716;--bg2:#52183a;--ink:#fff1ee;--gold:#ffd9a0;--rose:#ff7a9a;--soft:#f5c6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 15%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:'Hind Siliguri',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#card{max-width:420px;width:100%;transition:opacity .6s,transform .6s}
#card.out{opacity:0;transform:scale(.96)}
.glow{text-shadow:0 0 18px rgba(255,150,170,.55)}
h1{font-family:'Tiro Bangla',serif;font-weight:400;font-size:2.7rem;line-height:1.25;margin:0;color:var(--gold)}
.name{font-family:'Great Vibes',cursive;font-size:3.1rem;line-height:1.15;color:var(--rose);margin:8px 0}
.sub{font-size:1.25rem;color:var(--soft);margin-top:10px}
.txt{font-family:'Tiro Bangla',serif;font-size:1.4rem;line-height:1.9;min-height:10em;display:flex;align-items:center;justify-content:center}
.big{font-size:5.5rem;line-height:1;display:block;margin-bottom:14px}
.gift{animation:shake 1.4s infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-8deg)}85%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.cake{position:relative;display:inline-block}
.cake .big{font-size:7rem;margin:0}
.flame{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:2.2rem;transition:opacity .5s;animation:fl .5s infinite alternate}
@keyframes fl{to{transform:translateX(-50%) scale(1.15) rotate(4deg)}}
.flame.off{opacity:0;animation:none}
.btn{margin-top:26px;background:linear-gradient(135deg,#ff8fa8,#ffb27a);color:#3a0d22;border:0;border-radius:999px;padding:15px 34px;font:600 1.15rem 'Hind Siliguri',sans-serif;box-shadow:0 8px 28px rgba(255,122,154,.4)}
.pol{background:#fff8f2;padding:12px 12px 16px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 18px 50px rgba(0,0,0,.5);display:inline-block;color:#4a1630;max-width:88%}
.pol img,.pol .ph{width:100%;max-height:48vh;aspect-ratio:4/5;object-fit:cover;object-position:50% 32%;display:block;border-radius:3px;background:linear-gradient(135deg,#ffb3c4,#ffd9a0);font-size:4rem;line-height:1}
.pol .ph{display:flex;align-items:center;justify-content:center}
.pol p{margin:12px 0 0;font-family:'Tiro Bangla',serif;font-size:1.2rem}
#stage{z-index:1;padding:92px 44px 76px}
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s}
.ban{position:absolute;top:calc(32px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:.4vw}
.ban:before{content:"";position:absolute;left:3vw;right:3vw;top:-2px;height:2px;background:rgba(255,217,160,.7)}
.ban span{width:clamp(22px,6.6vw,34px);height:44px;clip-path:polygon(0 0,100% 0,50% 100%);text-align:center;padding-top:5px;font:600 clamp(11px,3.9vw,18px) 'Hind Siliguri',sans-serif;color:#3a0d22}
.ban span.sp{margin-left:2.5vw}
.bl{position:absolute;font-size:2.6rem;animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-16px) rotate(4deg)}}
.dc{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:2.6rem}
.fade{animation:fi 2.4s ease both}
@keyframes fi{from{opacity:0;filter:blur(8px);transform:scale(.97)}to{opacity:1;filter:none;transform:none}}
#dots{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:7px;justify-content:center}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:.4s}
#dots i.on{background:var(--rose);transform:scale(1.4)}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--soft);font-size:.95rem;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.gift,.flame,#hint{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="dots"></div>
<div id="decor"></div>
<div id="stage"><div id="card"></div></div>
<div id="hint">স্ক্রিনে ট্যাপ করো 🤍</div>
